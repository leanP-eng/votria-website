# VotrIA — configuration Netlify du site statique

[build]
  publish = "site"

# URL d’accueil explicite
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Anciennes routes : redirections permanentes vers les nouvelles pages
[[redirects]]
  from = "/cas-usage"
  to = "/cas-concrets/"
  status = 301

[[redirects]]
  from = "/conformite-ia-rgpd"
  to = "/confidentialite/"
  status = 301

[[redirects]]
  from = "/diagnostic"
  to = "/estimation/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/eligibilite-cap-ia/"
  status = 301

[[redirects]]
  from = "/exemple-cap-ia"
  to = "/cas-concrets/"
  status = 301

[[redirects]]
  from = "/demonstrateur-cap-ia-btp"
  to = "/eligibilite-cap-ia-btp/"
  status = 301

[[redirects]]
  from = "/btp"
  to = "/solutions/"
  status = 301

[[redirects]]
  from = "/industrie"
  to = "/eligibilite-cap-ia-autres-secteurs/"
  status = 301

[[redirects]]
  from = "/logistique"
  to = "/eligibilite-cap-ia-autres-secteurs/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/solutions/"
  status = 301

# En-têtes de sécurité
[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://lean-parform.app.n8n.cloud https://www.google-analytics.com https://region1.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; upgrade-insecure-requests"

# Cache des ressources statiques
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"
