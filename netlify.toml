# VotrIA — configuration Netlify V3.1

[build]
  publish = "site"

# Normalisation trailing-slash
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# /diagnostic sans slash → /diagnostic/ (pas de page physique)
[[redirects]]
  from = "/diagnostic"
  to = "/diagnostic/"
  status = 301

# Anciennes pages supprimées — force=true car les fichiers physiques existent dans site/
[[redirects]]
  from = "/solutions*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/offres*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cas-concrets*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/a-propos*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/methode*"
  to = "/diagnostic/"
  status = 301
  force = true

[[redirects]]
  from = "/estimation*"
  to = "/diagnostic/"
  status = 301
  force = true

[[redirects]]
  from = "/guide-btp*"
  to = "/diagnostic/"
  status = 301
  force = true

[[redirects]]
  from = "/eligibilite-cap-ia-autres-secteurs*"
  to = "/diagnostic/"
  status = 301
  force = true

[[redirects]]
  from = "/eligibilite-cap-ia-btp*"
  to = "/diagnostic/"
  status = 301
  force = true

[[redirects]]
  from = "/eligibilite-cap-ia*"
  to = "/diagnostic/"
  status = 301
  force = true

# Anciennes routes sans page physique
[[redirects]]
  from = "/calculateur"
  to = "/diagnostic/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/diagnostic/"
  status = 301

[[redirects]]
  from = "/demonstrateur-cap-ia-btp"
  to = "/diagnostic/"
  status = 301

[[redirects]]
  from = "/cas-usage"
  to = "/"
  status = 301

[[redirects]]
  from = "/exemple-cap-ia"
  to = "/"
  status = 301

[[redirects]]
  from = "/btp"
  to = "/"
  status = 301

[[redirects]]
  from = "/industrie"
  to = "/"
  status = 301

[[redirects]]
  from = "/logistique"
  to = "/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/"
  status = 301

[[redirects]]
  from = "/conformite-ia-rgpd"
  to = "/confidentialite/"
  status = 301

# En-têtes de sécurité
[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Cache des ressources statiques
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"
