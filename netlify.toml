# VotrIA — configuration Netlify V3.1

[build]
  publish = "site"

# /index.html : dédoublonnage — site/index.html existe en tant que fichier physique
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Anciennes pages supprimées — force=true car les fichiers physiques existent dans site/
[[redirects]]
  from = "/solutions"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/offres"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cas-concrets"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/a-propos"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/methode"
  to = "/diagnostic/"
  status = 301
  force = true

[[redirects]]
