# VotrIA — configuration Netlify du site statique.

[build]
  publish = "."
  command = "echo 'Site statique VotrIA - aucun build nécessaire'"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/offres"
  to = "/offres.html"
  status = 200

